
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des commandes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header class="py-4 mb-4">
        <div class="container">
            <h1 class="text-center">Gestion des commandes</h1>
            <p class="text-center mb-0">Gestion des clients, produits et commandes</p>
        </div>
    </header>

    <main class="container pb-5">
        <section class="mb-4">
            <h2 class="section-title">Tableau de bord</h2>
            <div id="indicateurs" class="row g-3"></div>
        </section>

        <section class="mb-4">
            <h2 class="section-title">Recherche et filtres</h2>

            <div class="filter-card">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label for="recherche" class="form-label">
                            Rechercher un client
                        </label>
                        <input type="text" id="recherche"
                               class="form-control"
                               placeholder="Nom du client...">
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="filtreStatut" class="form-label">
                            Statut de la commande
                        </label>
                        <select id="filtreStatut" class="form-select">
                            <option value="all">Tous les statuts</option>
                            <option value="En cours">En cours</option>
                            <option value="Livrée">Livrée</option>
                            <option value="Annulée">Annulée</option>
                        </select>
                    </div>

                    <div class="col-12 col-md-4">
                        <label for="filtreCategorie" class="form-label">
                            Catégorie du produit
                        </label>
                        <select id="filtreCategorie" class="form-select">
                            <option value="all">Toutes les catégories</option>
                        </select>
                    </div>
                </div>

                <button id="reinitialiser" class="btn btn-outline-light mt-3">
                    Réinitialiser les filtres
                </button>
            </div>
        </section>

        <section class="mb-4">
            <h2 class="section-title">Liste des commandes</h2>
            <p id="nombre-resultats" class="text-secondary"></p>

            <div id="erreur" class="alert alert-danger d-none"></div>

            <div class="table-responsive">
                <table class="table table-dark table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Client</th>
                            <th>Date</th>
                            <th>Statut</th>
                            <th>Total</th>
                            <th>Détails</th>
                        </tr>
                    </thead>
                    <tbody id="commandes">
                        <tr>
                            <td colspan="6" class="text-center">
                                Chargement des commandes...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>

        <section id="detailsSection" class="mb-4 d-none">
            <h2 class="section-title">Détails de la commande</h2>
            <div id="details" class="detail-card"></div>
        </section>
    </main>

    <footer class="text-center py-3">
        <p class="mb-0">TP4 — Application JavaScript structurée</p>
    </footer>

    <script type="module" src="js/app.js"></script>
</body>
</html>
